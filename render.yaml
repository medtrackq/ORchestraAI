# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repository.
services:
  - type: web
    name: orchestra-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: APP_USERNAME
        value: orchestra
      - key: APP_PASSWORD
        generateValue: true  # shown under Environment in the Render dashboard
      - key: SOLVER_WORKERS
        value: "1"  # the free plan has a fraction of one CPU
      - key: SOLVER_TIME_LIMIT
        value: "15"
