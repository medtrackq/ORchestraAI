[project]
name = "orchestra-engine"
version = "0.1.0"
description = "ORchestraAI: multi-agent operating room scheduling engine (OR-Tools CP-SAT)"
requires-python = ">=3.10"
dependencies = ["ortools>=9.10"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1", "anthropic>=2.0", "pywebpush>=2.0", "openpyxl>=3.1", "segno>=1.6", "cryptography>=42"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29", "psycopg[binary]>=3.1", "anthropic>=2.0", "pywebpush>=2.0", "openpyxl>=3.1", "segno>=1.6", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["orchestra_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
