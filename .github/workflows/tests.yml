# Runs every test on each pull request (and on main after a merge), with a real PostgreSQL
# for the Supabase-mode tests. Python 3.12 is what Render runs (render.yaml PYTHON_VERSION).
name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:  # a newer push to the same pull request replaces the run still going
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres  # each test makes its own database
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v7  # v6+ run on Node.js 24 (Node.js 20 is retired on GitHub runners)

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (undefined or unused names)
        run: python -m pyflakes app orchestra_engine

      - name: Tests (engine, web app, Supabase mode on PostgreSQL)
        run: python -m pytest -q --durations=10
